<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatApp</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Space+Mono:wght@400;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <div id="login-screen" class="login-wrap">
        <div class="login-card">
            <div class="login-logo">
                <span class="logo-icon">&#9632;</span>
                <span class="logo-text">ChatApp</span>
            </div>
            <p class="login-sub">A room. Real time. No noise.</p>
            <div class="login-form">
                <input type="text" id="username" class="login-input" placeholder="choose a username" maxlength="24"
                    autocomplete="off" />
                <button class="login-btn" onclick="joinChat()">Enter Room →</button>
            </div>
            <p class="login-hint">No sign-up. Just a name.</p>
        </div>
    </div>

    <div id="chat-screen" class="chat-wrap" style="display:none;">
        <aside class="sidebar">
            <div class="sidebar-logo">
                <span class="logo-icon-sm">&#9632;</span>
                <span class="logo-text-sm">ChatApp</span>
            </div>
            <div class="room-info">
                <div class="room-dot"></div>
                <span class="room-name">General</span>
            </div>
            <div class="you-badge">
                <span class="you-label">you</span>
                <span id="current-user" class="you-name">—</span>
            </div>
            <button class="logout-btn" onclick="location.reload()">↩ Leave</button>
        </aside>
        <main class="main-area">
            <div class="chat-header">
                <div class="header-left">
                    <span class="header-room"># general</span>
                    <span class="header-status" id="connection-status">connecting…</span>
                </div>
            </div>
            <div id="messages" class="messages-area"></div>
            <div class="input-row">
                <input type="text" id="msg" class="msg-input" placeholder="say something…" autocomplete="off" />
                <button class="send-btn" onclick="sendMessage()">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                        stroke-linecap="round" stroke-linejoin="round">
                        <line x1="22" y1="2" x2="11" y2="13" />
                        <polygon points="22 2 15 22 11 13 2 9 22 2" />
                    </svg>
                </button>
            </div>
        </main>
    </div>

    <script src="/static/script.js"></script>
</body>

</html>
